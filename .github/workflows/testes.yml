# Roda os testes em todo pull request e em todo push na main.
# Não usa a chave do Gemini: os testes não chamam a API.
# Sobe um PostgreSQL só para os testes do banco (sem ele, esses testes são pulados).
name: testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raiox_teste
        ports:
          - 5432:5432
        # espera o banco aceitar conexões antes de rodar os testes
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raiox_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar as dependências
        run: pip install -r requirements.txt
      # -rs lista no log os testes pulados e o motivo (os do banco não devem aparecer)
      - name: Rodar os testes
        run: python -m pytest -q -rs
