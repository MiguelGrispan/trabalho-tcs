# Roda os testes em todo pull request e em todo push na main.
# Não usa a chave do Gemini: os testes não chamam a API.
name: testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar as dependências
        run: pip install -r requirements.txt
      - name: Rodar os testes
        run: python -m pytest -q
